<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>huaban 華伴</title>
<!-- Tailwind CDN（需要網路）。若要離線使用，可改為本機的 tailwind 檔案。 -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--o:#ff9600;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#e9eee4;margin:0}
button{font-family:inherit;cursor:pointer}
#app{background:#f7f9f4;min-height:100vh;position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 8px 20px rgba(40,70,20,.07)}
.btn{border:0;border-radius:16px;font-weight:800;padding:14px 18px;letter-spacing:.03em;transition:transform .08s,box-shadow .08s;font-size:15px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none!important}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn-blue{background:var(--b);color:#fff;box-shadow:0 4px 0 var(--bd)}
.btn-red{background:var(--r);color:#fff;box-shadow:0 4px 0 var(--rd)}
.btn-ghost{background:#fff;color:var(--mut);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#e5e5e5!important;color:#afafaf!important;box-shadow:none!important;cursor:not-allowed;border-color:transparent}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:12px}
.hdr{background:linear-gradient(135deg,#58cc02,#2fb344 55%,#1cb0f6)}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.stat{background:rgba(255,255,255,.2);border-radius:16px;padding:8px 12px;flex:1;text-align:center;font-weight:800}
.stat small{display:block;font-weight:600;font-size:11px;opacity:.9}
.logo-fb{display:none;width:44px;height:44px;border-radius:14px;background:#fff;color:var(--g);font-weight:900;font-size:24px;align-items:center;justify-content:center}
.bar{height:14px;background:#e5e5e5;border-radius:99px;overflow:hidden}
.barfill{height:100%;background:var(--g);border-radius:99px;transition:width .3s;width:0}
.barfill.gold{background:var(--y)}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 10px}
.b-done{background:#d7ffb8;color:#46a302}.b-prog{background:#ddf4ff;color:#1899d6}.b-lock{background:#eee;color:#999}
.unit-img{position:relative;width:96px;min-height:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.unit-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lnode{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;font-weight:700;text-align:left}
.lnode .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#eee;flex-shrink:0}
.lnode.done .dot{background:var(--g);color:#fff}.lnode.cur{border-color:var(--b);background:#ddf4ff}.lnode.cur .dot{background:var(--b);color:#fff}.lnode.lock{opacity:.5}
.connector{width:4px;height:18px;background:#d9dfd2;margin:0 auto;border-radius:4px}
.layer{display:none;position:fixed;inset:0;margin:0 auto;max-width:28rem;background:#fff;z-index:40;flex-direction:column}
.layer.open{display:flex}
.fb{padding:14px 18px;font-weight:700}
.fb.ok{background:#d7ffb8;color:#46a302}.fb.bad{background:#ffdfe0;color:#ea2b2b}
.fb .sm{font-size:13px;font-weight:600;margin-top:4px;opacity:.95}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--line);background:#fff;text-align:left;width:100%;font-weight:700;font-size:16px;color:var(--ink)}
.opt.sel{border-color:var(--b);background:#ddf4ff;box-shadow:0 3px 0 var(--b);color:#1899d6}
.opt.ok{border-color:var(--g);background:#d7ffb8;box-shadow:0 3px 0 var(--g)}
.opt.bad{border-color:var(--r);background:#ffdfe0;box-shadow:0 3px 0 var(--r)}
.opt:disabled{opacity:1}
.chip{border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;background:#fff;box-shadow:0 3px 0 var(--line);font-size:16px}
.chip.sel{border-color:var(--b);background:#ddf4ff;color:#1899d6;box-shadow:0 3px 0 var(--b)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--gd)}
.locked{pointer-events:none}
.qtitle{font-size:22px;font-weight:900;margin:8px 0 16px}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--b);text-align:center;color:var(--b);font-weight:900}
.inp{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:20px;background:#f7f7f7;outline:none}
.inp:focus{border-color:var(--b);background:#fff}
.tray{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;background:repeating-linear-gradient(transparent,transparent 62px,#eee 62px,#eee 64px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);border-radius:14px;padding:6px 14px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;font-weight:800;display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.tok small{font-size:10px;font-weight:600;color:var(--mut)}
.tok.ghost{background:#eee;color:transparent;box-shadow:none;border-color:#eee}
.mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:38px;box-shadow:0 6px 0 var(--bd)}
.mic.rec{background:var(--r);box-shadow:0 6px 0 var(--rd);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 var(--rd),0 0 0 0 rgba(255,75,75,.5)}100%{box-shadow:0 6px 0 var(--rd),0 0 0 22px rgba(255,75,75,0)}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 12px;border-radius:99px;background:#eee;color:#777;margin-bottom:12px}
.status i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.status.listening{background:#ffdfe0;color:#ea2b2b}.status.listening i{background:var(--r);animation:blink 1s infinite}
.status.done{background:#d7ffb8;color:#46a302}.status.done i{background:var(--g)}
.status.error{background:#fff0d0;color:#c27b00}.status.error i{background:var(--o)}
@keyframes blink{50%{opacity:.2}}
.wchip{display:inline-block;margin:4px;padding:6px 12px;border-radius:12px;font-size:22px;font-weight:800}
.wchip.ok{background:#d7ffb8;color:#46a302}
.wchip.bad{background:#ffdfe0;color:#ea2b2b;text-decoration:underline wavy var(--r);text-underline-offset:6px}
.note{background:#fff9e0;border:2px solid #ffe58a;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps span{flex:1;text-align:center;font-size:10px;font-weight:800;padding:4px 0;border-radius:8px;background:#eee;color:#999}
.steps span.on{background:var(--b);color:#fff}.steps span.past{background:#d7ffb8;color:#46a302}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;align-items:center;justify-content:center}
.modal.open{display:flex}
.navbtn{flex:1;padding:8px 0 10px;border:0;background:none;font-weight:800;font-size:11px;color:#aaa;display:flex;flex-direction:column;align-items:center;gap:2px}
.navbtn span{font-size:22px;filter:grayscale(1);opacity:.6}
.navbtn.on{color:var(--g)}.navbtn.on span{filter:none;opacity:1}
.han{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
details summary{cursor:pointer;color:var(--b);font-weight:700;font-size:13px}
.link{background:none;border:0;color:var(--mut);font-weight:700;text-decoration:underline;font-size:13px;margin-top:10px}
select{border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:700;background:#fff;width:100%}
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto">
  <main id="view" style="padding-bottom:88px"></main>

  <nav id="nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white flex" style="z-index:30;border-top:2px solid #e5e5e5;padding-bottom:env(safe-area-inset-bottom)"></nav>

  <!-- 課程畫面（覆蓋層） -->
  <div id="lessonLayer" class="layer">
    <div class="flex items-center gap-3 p-4">
      <button id="lsExit" class="btn btn-ghost btn-sm" aria-label="exit">✕</button>
      <div class="bar flex-1"><div id="lsBar" class="barfill"></div></div>
      <div id="lsHp" class="font-bold text-sm"></div>
    </div>
    <div id="lsBody" class="flex-1 overflow-y-auto px-5 pb-4"></div>
    <div id="lsFoot">
      <div id="lsFb" class="fb" style="display:none"></div>
      <div class="flex gap-3 p-4 bg-white" style="border-top:2px solid #eee">
        <button id="lsPrev" class="btn btn-ghost"></button>
        <button id="lsMain" class="btn btn-primary flex-1"></button>
      </div>
    </div>
  </div>

  <!-- 二次確認 Modal -->
  <div id="modal" class="modal">
    <div class="card p-5" style="width:90%;max-width:22rem">
      <h3 id="mTitle" class="text-xl font-black mb-2"></h3>
      <p id="mBody" class="text-sm text-slate-600 mb-4"></p>
      <div class="flex gap-3">
        <button id="mCancel" class="btn btn-ghost flex-1"></button>
        <button id="mOk" class="btn btn-red flex-1"></button>
      </div>
    </div>
  </div>
</div>

    單元詞彙：u{單元}_vocab{序號}.mp3   例如 assets/audio/u1_vocab1.mp3

function dstr(ts){ return new Date(ts||Date.now()).toLocaleDateString('en-CA'); }
const defaults = () => ({lang:'zh',xp:0,dailyXp:0,dailyDate:dstr(),streak:0,lastDay:null,done:{},vocab:{},wrong:{},grammar:{},speech:{},history:[],quiz:{c:0,t:0},lastLesson:null});
function load(){ try{ const r=JSON.parse(localStorage.getItem(STORE_KEY)); return Object.assign(defaults(), r||{}); }catch(e){ return defaults(); } }
let S = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const vById = id => VOCAB.find(v=>v.id===id);
const unitById = id => UNITS.find(u=>u.id===id);
const plain = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'').toLowerCase();

function rollDaily(){ if(S.dailyDate!==dstr()){ S.dailyDate=dstr(); S.dailyXp=0; } }
function touchStreak(){ const td=dstr(); if(S.lastDay===td) return; const y=dstr(Date.now()-864e5); S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=td; }
function addXp(n){ rollDaily(); S.xp+=n; S.dailyXp+=n; touchStreak(); save(); }
function streakNow(){ const td=dstr(), y=dstr(Date.now()-864e5); return (S.lastDay===td||S.lastDay===y)?S.streak:0; }

const lessonDone = lid => !!S.done[lid];
const unitDone = u => u.lessons.every(lessonDone);
const unitUnlocked = u => { const i=UNITS.indexOf(u); return i===0 || unitDone(UNITS[i-1]); };
const lessonUnlocked = (u,lid) => { if(!unitUnlocked(u)) return false; const k=u.lessons.indexOf(lid); return k===0 || lessonDone(u.lessons[k-1]); };
const unitStatus = u => unitDone(u)?'done':(!unitUnlocked(u)?'lock':'prog');
const curLevel = () => UNITS.filter(u=>u.level==='A1').every(unitDone)?'A2':'A1';
function nextLesson(){ for(const u of UNITS) for(const l of u.lessons) if(!lessonDone(l)) return {u,lid:l}; return null; }

/* 詞彙熟悉度（間隔複習：fam 0~5 → 下次複習天數） */
const FAM_DAYS = [0,1,2,4,7,14];
const getV = id => S.vocab[id] || {fam:0,review:false,seen:false,due:0};
function ensureV(id){ if(!S.vocab[id]) S.vocab[id]={fam:0,review:false,seen:false,due:0}; return S.vocab[id]; }
function markSeen(id){ const s=ensureV(id); if(!s.seen){ s.seen=true; s.fam=Math.max(1,s.fam); s.due=Date.now()+FAM_DAYS[1]*864e5; save(); } }
function vocabResult(id,ok){ const s=ensureV(id); s.seen=true; if(ok){ s.fam=Math.min(5,s.fam+1); s.due=Date.now()+FAM_DAYS[s.fam]*864e5; } else { s.fam=Math.max(0,s.fam-1); s.review=true; s.due=Date.now(); } }
function dueVocab(){ const now=Date.now(); return VOCAB.filter(v=>{ const s=S.vocab[v.id]; return s && (s.review || (s.seen && s.fam<5 && s.due<=now)); }); }
const wrongList = () => Object.values(S.wrong).filter(w=>!w.resolved);
const grammarList = () => Object.keys(S.grammar).filter(g=>S.grammar[g] && GRAMMAR[g]);
const speechTodo = () => SPEECH.filter(s=>!(S.speech[s.id] && S.speech[s.id].passes>0));
const reviewCount = () => wrongList().length + dueVocab().length + grammarList().length;

   ===================================================================== */
function speakText(text){ try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=.85; speechSynthesis.speak(u); }catch(e){} }
function playStd(path, text){
  const a=$('#stdAudio'); let fell=false; const fb=()=>{ if(fell) return; fell=true; speakText(text); };
  try{ a.pause(); }catch(e){}
  if(!path){ fb(); return; }
  a.onerror=fb; a.src=path;
  const p=a.play(); if(p && p.catch) p.catch(fb);
}

/* =====================================================================
   5. 獨立模組：SpeechPracticeModule（語音辨識 + 比對，與畫面渲染分離）
   ===================================================================== */
const SpeechPracticeModule = (function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const SIMP = {'学':'學','师':'師','谢':'謝','饭':'飯','车':'車','钱':'錢','个':'個','气':'氣','买':'買','贵':'貴','热':'熱','这':'這','见':'見','对':'對','说':'說','运':'運','们':'們','么':'麼','两':'兩','吗':'嗎','爱':'愛','来':'來','时':'時','会':'會','样':'樣','钟':'鐘','杯':'杯','岁':'歲','点':'點','还':'還','没':'沒','认':'認','识':'識'};
  let rec=null, finalText='', interimText='';
  let cfg={ store:()=>({}), persist:()=>{}, onActivity:()=>{} };
  const api = {
    supported: !!SR,
    configure(c){ cfg=Object.assign(cfg,c); },
    /* 步驟 4：請求麥克風權限 */
    async requestMic(){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
      try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(x=>x.stop()); return true; }catch(e){ return false; }
    },
    /* 步驟 5~6：開始辨識並回傳即時文字 */
    listen(h){
      finalText=''; interimText='';
      rec=new SR(); rec.lang='zh-TW'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
      rec.onstart=()=>h.onState&&h.onState('listening');
      rec.onresult=e=>{ let f='',i=''; for(let k=0;k<e.results.length;k++){ const tr=e.results[k][0].transcript; if(e.results[k].isFinal) f+=tr; else i+=tr; } finalText=f; interimText=i; h.onText&&h.onText(f,i); };
      rec.onerror=e=>{ h.onError&&h.onError(e.error); };
      rec.onend=()=>{ h.onEnd&&h.onEnd((finalText+interimText).trim()); };
      try{ rec.start(); }catch(err){ h.onError&&h.onError('start-failed'); }
    },
    /* 步驟 7：停止錄音，onend 會觸發比對 */
    stop(){ try{ rec&&rec.stop(); }catch(e){} },
    abort(){ try{ if(rec){ rec.onend=null; rec.onerror=null; rec.abort(); } }catch(e){} rec=null; },
    normalize(s){ return Array.from(String(s||'')).map(c=>SIMP[c]||c).filter(c=>!/[\s\u3000-\u303f\uff00-\uffef.,!?;:'"()\-…「」]/.test(c)); },
    /* 步驟 8：逐字（LCS）比對，再彙整成逐詞標示 */
    evaluate(sent,text){
      const tgt=this.normalize(sent.han), rc=this.normalize(text), n=tgt.length, m=rc.length;
      const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
      for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) dp[i][j]= tgt[i-1]===rc[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
      const tm=Array(n).fill(false), rm=Array(m).fill(false); let i=n,j=m;
      while(i>0&&j>0){ if(tgt[i-1]===rc[j-1]){ tm[i-1]=rm[j-1]=true; i--; j--; } else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--; }
      let p=0; const words=sent.words.map(w=>{ const len=Array.from(w).length; const ok=tm.slice(p,p+len).every(Boolean); p+=len; return {w,ok}; });
      const score=n?tm.filter(Boolean).length/n:0;
      return {text, words, score, passed:score>=0.8, extra:rc.filter((c,k)=>!rm[k]).join('')};
    },
    /* 步驟 10：記錄練習次數與通過率 */
    record(sid,passed){ const st=cfg.store(); const r=st[sid]||(st[sid]={attempts:0,passes:0,last:0}); r.attempts++; if(passed) r.passes++; r.last=Date.now(); cfg.persist(); cfg.onActivity(passed); },
    stats(sid){ const r=cfg.store()[sid]||{attempts:0,passes:0}; return {attempts:r.attempts,passes:r.passes,rate:r.attempts?Math.round(r.passes/r.attempts*100):0}; }
  };
  return api;
})();
SpeechPracticeModule.configure({ store:()=>S.speech, persist:save, onActivity:()=>{ touchStreak(); save(); } });

    const q=s=>el.querySelector(s), $st=q('[data-r=status]'), $mic=q('[data-r=mic]'), $lbl=q('[data-r=lbl]'), $live=q('[data-r=live]'), $res=q('[data-r=result]');
    const stepIdx={idle:0,requesting:1,listening:2,processing:3,done:4,error:0};
    function setState(s,msg){
      state=s; const map={idle:'sp_st_idle',requesting:'sp_st_req',listening:'sp_st_listen',processing:'sp_st_proc',done:'sp_st_done',error:'sp_st_err'};
      $st.className='status '+(s==='listening'?'listening':s==='done'?'done':s==='error'?'error':''); $st.querySelector('span').textContent=msg||t(map[s]);

    }

    function finish(text){
      if(!text){ setState('error',t('sp_nosound')); return; }
      result=M.evaluate(sent,text); M.record(sent.id,result.passed); setState('done'); renderResult(); onResult&&onResult(result);
    }

      const st=M.stats(sent.id), pct=Math.round(result.score*100);

        <div class="text-xs font-bold text-slate-400 mt-3">${t('sp_compare')}</div>

        <div class="text-sm mt-2 text-slate-500">${t('sp_you')}：<span class="han">${result.text}</span>${result.extra?` ｜ ${t('sp_extra')}：<b class="text-amber-600 han">${result.extra}</b>`:''}</div>
        <div class="text-xs text-slate-400 mt-2">${t('sp_att')} ${st.attempts} ・ ${t('sp_rate')} ${st.rate}%</div>
        <div class="flex gap-2 mt-3"><button class="btn btn-blue btn-sm flex-1" data-a="replay">🔊 ${t('sp_replay')}</button><button class="btn btn-ghost btn-sm flex-1" data-a="retry">↻ ${t('sp_retry')}</button></div></div>`;
      $res.querySelector('[data-a=replay]').onclick=()=>playStd(sent.audio,sent.han);

    }
    function reset(){ M.abort(); result=null; errored=false; $res.innerHTML=''; showLive(''); setState('idle'); onResult&&onResult(null); }
    async function start(){
      result=null; errored=false; $res.innerHTML=''; showLive(''); onResult&&onResult(null);
      if(!M.supported){ setState('error',t('sp_unsupported')); return; }
      setState('requesting');
      const ok=await M.requestMic(); if(!ok){ setState('error',t('sp_denied')); return; }
      M.listen({
        onState:()=>setState('listening'),
        onText:(f,i)=>showLive(f+i),
        onError:e=>{ errored=true; setState('error', (e==='not-allowed'||e==='service-not-allowed')?t('sp_denied'):(e==='no-speech'?t('sp_nosound'):t('sp_err')+' ('+e+')')); },
        onEnd:txt=>{ if(errored) return; setState('processing'); finish(txt); }
      });
    }
    $mic.onclick=()=>{ if(state==='listening') M.stop(); else if(state!=='requesting'&&state!=='processing') start(); };
    q('[data-a=model]').onclick=()=>playStd(sent.audio,sent.han);

/* =====================================================================
   7. 課程引擎（Lesson）與各題型渲染器（Q）
   ===================================================================== */
let cur = {};
const NG = new Set(['vocab','grammar']);

function itemTitle(it){
  if(it.t==='match') return tx(it.q)||t('match_q');
  if(it.t==='order') return tx(it.en);
  if(it.t==='speak'){ const s=SPEECH.find(x=>x.id===it.sid); return s?s.han:''; }
  if(it.t==='fill'||it.t==='type') return it.q.replace('___','＿＿');
  return tx(it.q)||'';
}

const Lesson = {
  s:null,
  startLesson(lid){
    const l=LESSONS[lid]; if(!l) return;
    this.open({id:lid,title:l.title,real:true,entries:l.items.map((item,i)=>({item,ref:[lid,i],key:lid+':'+i}))});
  },
  open(cfg){
    this.s={cfg,entries:cfg.entries,i:0,hp:5,res:[],xp:0,right:0,graded:0,newWrong:0,vids:new Set(),ended:false,hadWrong:false};
    $('#lessonLayer').classList.add('open'); $('#nav').style.display='none'; $('#lsFoot').style.display='block';
    $('#lsPrev').textContent='← '+t('prev'); this.render();
  },
  render(){
    const s=this.s, e=s.entries[s.i], it=e.item, r=s.res[s.i];
    SpeechPracticeModule.abort(); try{ speechSynthesis.cancel(); }catch(x){}
    const body=$('#lsBody'); body.scrollTop=0; cur={};
    $('#lsBar').style.width=(s.res.filter(Boolean).length/s.entries.length*100)+'%';
    $('#lsHp').textContent='❤️'.repeat(s.hp)+'🤍'.repeat(5-s.hp);
    body.innerHTML='<div id="qbox"></div>';
    const box=$('#qbox'); if(r&&!r.ng) box.classList.add('locked');
    Q[it.t](box,it,r,e);
    if(r&&r.a&&cur.lock) cur.lock(r.a);
    this.sync();
  },
  sync(){
    const s=this.s; if(!s||s.ended) return;
    const it=s.entries[s.i].item, r=s.res[s.i], main=$('#lsMain'), last=s.i===s.entries.length-1;
    $('#lsPrev').disabled=s.i===0;
    if(r){ main.disabled=false; main.textContent=last?t('finish'):t('next'); }
    else if(NG.has(it.t)){ main.disabled=false; main.textContent=t('cont_btn'); }
    else { main.disabled=!(cur.ans&&cur.ans()); main.textContent=t('check'); }
    main.className='btn flex-1 '+((r&&r.fb&&!r.ok)?'btn-red':'btn-primary');
    const fb=$('#lsFb'); if(r&&r.fb){ fb.className='fb '+(r.ok?'ok':'bad'); fb.innerHTML=r.fb; fb.style.display='block'; } else fb.style.display='none';
  },
  main(){
    const s=this.s, it=s.entries[s.i].item, r=s.res[s.i];
    if(r){ this.go(1); return; }
    if(NG.has(it.t)){ if(it.t==='vocab') markSeen(it.v); s.res[s.i]={ng:true}; this.go(1); return; }
    const a=cur.ans&&cur.ans(); if(!a) return; this.grade(a);
  },
  skip(){ const s=this.s; s.res[s.i]={ng:true,skipped:true}; this.go(1); },
  grade(a){
    const s=this.s, e=s.entries[s.i], it=e.item, ok=!!a.correct;
    s.graded++; S.quiz.t++;
    if(ok){ s.right++; S.quiz.c++; s.xp+=10; if(S.wrong[e.key]) S.wrong[e.key].resolved=true; }
    else {
      s.hp--; s.hadWrong=true;
      if(e.ref){ const prev=S.wrong[e.key]; if(!prev||prev.resolved) s.newWrong++; S.wrong[e.key]={key:e.key,lid:e.ref[0],idx:e.ref[1],q:itemTitle(it),ans:a.ans,count:(prev?prev.count:0)+1,resolved:false,at:Date.now()}; }
      else s.newWrong++;
      if(it.v) s.vids.add(it.v);
    }
    if(it.v) vocabResult(it.v,ok);
    const exp=tx(it.exp);
    const fb= ok ? `<b>${t('correct')}</b>${exp?`<div class="sm">${exp}</div>`:''}`
                 : `<b>✗ ${t('wrong')}</b><div>${t('right_ans')}<span class="han">${a.ans}</span></div>${exp?`<div class="sm">${exp}</div>`:''}`;
    s.res[s.i]={ok,fb,a}; save();
    if(cur.lock) cur.lock(a);
    $('#qbox').classList.add('locked');
    $('#lsHp').textContent='❤️'.repeat(Math.max(0,s.hp))+'🤍'.repeat(5-Math.max(0,s.hp));
    $('#lsBar').style.width=(s.res.filter(Boolean).length/s.entries.length*100)+'%';
    this.sync();
  },
  go(d){
    const s=this.s;
    if(d>0){ if(s.hp<=0&&s.res[s.i]) return this.finish(true); if(s.i>=s.entries.length-1) return this.finish(false); s.i++; }
    else if(s.i>0) s.i--;
    this.render();
  },
  finish(hpOut){
    const s=this.s; s.ended=true; SpeechPracticeModule.abort();
    if(!hpOut) s.xp+=5;
    const acc=s.graded?Math.round(s.right/s.graded*100):100;
    addXp(s.xp);
    if(s.cfg.real){
      if(!hpOut){ const old=S.done[s.cfg.id]; S.done[s.cfg.id]={acc:Math.max(acc,old?old.acc:0),at:Date.now()}; S.lastLesson=s.cfg.id; }
      if(s.hadWrong) s.entries.forEach(e=>{ if(e.item.t==='grammar') S.grammar[e.item.gid]=true; });
    }
    S.history.unshift({t:Date.now(),title:s.cfg.title,acc,xp:s.xp,right:s.right,total:s.graded,hpOut}); S.history=S.history.slice(0,30); save();
    const vlist=[...s.vids].map(id=>vById(id)).filter(Boolean);
    const glist=s.cfg.real&&s.hadWrong?s.entries.filter(e=>e.item.t==='grammar').map(e=>e.item):[];
    $('#lsFoot').style.display='none'; $('#lsBar').style.width='100%';
    $('#lsBody').innerHTML=`<div class="text-center pt-6">
      <div style="font-size:72px">${hpOut?'💔':(acc>=80?'🏆':'🎉')}</div>
      <h2 class="text-3xl font-black mt-2">${hpOut?t('hp_out'):t('lesson_done')}</h2>
      <div class="grid grid-cols-2 gap-3 mt-6 text-left">
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('correct_cnt')}</div><div class="text-2xl font-black text-green-600">${s.right}</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('total_q')}</div><div class="text-2xl font-black">${s.graded}</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('accuracy')}</div><div class="text-2xl font-black text-sky-500">${acc}%</div></div>
        <div class="card p-4"><div class="text-xs font-bold text-slate-400">${t('xp_gain')}</div><div class="text-2xl font-black text-amber-500">+${s.xp}</div></div>
        <div class="card p-4 col-span-2"><div class="text-xs font-bold text-slate-400">${t('new_wrong')}</div><div class="text-2xl font-black text-red-500">${s.newWrong}</div></div>
      </div>
      ${(vlist.length||glist.length)?`<div class="card p-4 mt-4 text-left"><div class="font-black mb-2">📌 ${t('suggest')}</div>
        ${vlist.map(v=>`<span class="chip han" style="display:inline-block;margin:3px;font-size:14px">${v.han} <small>${v.py}</small></span>`).join('')}
        ${glist.map(g=>`<div class="text-sm mt-2">📘 ${tx(g.title)}</div>`).join('')}</div>`:''}
      <div class="grid gap-3 mt-6 pb-6">
        ${hpOut?`<button class="btn btn-blue" id="lsRetry">${t('retry')}</button>`:''}
        <button class="btn btn-primary" id="lsBack">${t('back_map')}</button></div></div>`;
    $('#lsBack').onclick=()=>this.close();
    if(hpOut) $('#lsRetry').onclick=()=>{ const cfg=s.cfg; cfg.entries=s.entries; this.open(cfg); };
  },
  exit(){
    if(this.s&&this.s.ended){ this.close(); return; }
    Modal.confirm({title:t('exit_title'),body:t('exit_body'),ok:t('leave'),cancel:t('stay'),onOk:()=>this.close()});
  },
  close(){ SpeechPracticeModule.abort(); try{speechSynthesis.cancel();}catch(e){} $('#lessonLayer').classList.remove('open'); $('#nav').style.display='flex'; this.s=null; App.render(); }
};

Q.match = (box,it,r) => {
  const Ls=shuffle(it.pairs.map((p,i)=>({i,x:p[0]}))), Rs=shuffle(it.pairs.map((p,i)=>({i,x:p[1]})));
  box.innerHTML=`<h2 class="qtitle">${tx(it.q)||t('match_q')}</h2><div class="text-sm text-slate-500 mb-3">${t('match_q')}</div>
    <div class="grid grid-cols-2 gap-3"><div class="grid gap-3" data-c="L">${Ls.map(o=>`<button class="opt han" data-i="${o.i}">${o.x}</button>`).join('')}</div>
    <div class="grid gap-3" data-c="R">${Rs.map(o=>`<button class="opt han" data-j="${o.i}">${o.x}</button>`).join('')}</div></div>`;
  cur.left=null; cur.done=new Set(); cur.miss=0;
  const lb=box.querySelectorAll('[data-i]'), rb=box.querySelectorAll('[data-j]');
  lb.forEach(b=>b.onclick=()=>{ if(b.disabled) return; cur.left=+b.dataset.i; lb.forEach(x=>x.classList.toggle('sel',x===b)); });
  rb.forEach(b=>b.onclick=()=>{
    if(b.disabled||cur.left==null) return; const j=+b.dataset.j, i=cur.left;
    if(i===j){ cur.done.add(i); b.classList.add('ok'); b.disabled=true; lb.forEach(x=>{ if(+x.dataset.i===i){ x.classList.remove('sel'); x.classList.add('ok'); x.disabled=true; } }); }
    else { cur.miss++; b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),450); lb.forEach(x=>x.classList.remove('sel')); }
    cur.left=null; Lesson.sync();
  });
  cur.ans=()=>cur.done.size===it.pairs.length?{correct:cur.miss===0,user:cur.miss+' ✗',ans:it.pairs.map(p=>p[0]+' ＝ '+p[1]).join('；')}:null;
  cur.lock=()=>{ box.querySelectorAll('.opt').forEach(b=>{ b.classList.remove('sel'); b.classList.add('ok'); }); };
};

  function draw(){
    $('#oAns').innerHTML=placed.map(tok).join('');

  }
  draw();
  cur.ans=()=>{ if(!placed.length) return null; const u=placed.map(k=>tokens[k]).join(''); return {correct:u===it.ans,user:u,ans:it.ans}; };
};

  return `<div class="p-4 grid gap-3"><h1 class="text-2xl font-black">🔁 ${t('review_title')}</h1>
  ${sec('❌ '+t('sec_wrong'),wl.length,wl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewWrong()">${t('restart')}</button>`:'',
    wl.length?wl.map(w=>`<div class="py-2" style="border-top:1px solid #eee"><div class="han font-bold">${w.q}</div><div class="text-xs text-slate-500">${t('right_ans')}<span class="han">${w.ans}</span> ・ ${w.count} ${t('times')}</div><button class="btn btn-ghost btn-sm mt-1" onclick="App.resolveWrong('${w.key}')">✓ ${t('mark_known')}</button></div>`).join(''):empty)}
  ${sec('📒 '+t('sec_vocab'),vl.length,vl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewVocab()">${t('restart')}</button>`:'',
    vl.length?vl.map(v=>{ const s=getV(v.id); return `<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1"><span class="han font-black text-lg">${v.han}</span> <span class="text-sky-500 text-sm">${v.py}</span><div class="text-xs text-slate-500">${v.en} ・ <span class="text-amber-500">${stars(s.fam)}</span> ${s.review?'🔖':''}</div></div><button class="btn btn-ghost btn-sm" onclick="App.knowVocab('${v.id}')">✓</button></div>`; }).join(''):empty)}
  ${sec('📘 '+t('sec_grammar'),gl.length,gl.length?`<button class="btn btn-primary btn-sm" onclick="App.reviewGrammar()">${t('restart')}</button>`:'',
    gl.length?gl.map(g=>`<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1 font-bold">${tx(GRAMMAR[g].title)}</div><button class="btn btn-ghost btn-sm" onclick="App.knowGrammar('${g}')">✓ ${t('mark_known')}</button></div>`).join(''):empty)}
  ${sec('🎤 '+t('sec_speech'),sl.length,'',
    sl.length?sl.map(s=>`<div class="py-2 flex items-center gap-3" style="border-top:1px solid #eee"><div class="flex-1"><div class="han font-bold">${s.han}</div><div class="text-xs text-slate-500">${s.py}</div></div><button class="btn btn-blue btn-sm" onclick="App.spIdx=${SPEECH.indexOf(s)};App.go('speech')">${t('start')}</button></div>`).join(''):empty)}
  <div class="card p-4"><div class="font-black mb-2">📊 ${t('sec_hist')}</div>
    <div class="text-sm text-slate-500">${t('quiz_total')}：${S.quiz.t}（✓ ${S.quiz.c} / ✗ ${S.quiz.t-S.quiz.c}）</div>
    <div class="text-xs font-bold text-slate-400 mt-3 mb-1">${t('fam_dist')}</div>
    <div class="flex items-end gap-2" style="height:70px">${dist.map((n,i)=>`<div class="flex-1 text-center text-xs"><div style="height:${Math.max(4,n/mx*48)}px;background:var(--g);border-radius:6px 6px 0 0"></div>${i}★<br><b>${n}</b></div>`).join('')}</div>
    ${S.history.slice(0,5).map(h=>`<div class="text-xs text-slate-500 py-1" style="border-top:1px solid #eee"><span class="han">${tx(h.title)}</span> ・ ${h.acc}% ・ +${h.xp}XP ・ ${dstr(h.t)}</div>`).join('')}</div>
  </div>`;
};

View.profile = () => {
  const units=UNITS.filter(unitDone).length, lessons=Object.keys(S.done).length;
  const seen=VOCAB.filter(v=>getV(v.id).seen).length, acc=S.quiz.t?Math.round(S.quiz.c/S.quiz.t*100)+'%':'—';
  const sp=Object.values(S.speech).reduce((a,r)=>a+r.attempts,0);
  const cell=(l,v)=>`<div class="card p-3"><div class="text-xs font-bold text-slate-400">${l}</div><div class="text-xl font-black">${v}</div></div>`;
  return `<div class="p-4 grid gap-4"><div class="text-center pt-2"><div style="font-size:56px">🧑‍🎓</div><h1 class="text-2xl font-black">${t('profile_title')}</h1></div>
    <div class="grid grid-cols-2 gap-3">
      ${cell(t('s_level'),curLevel())}${cell(t('s_units'),units+'/'+UNITS.length)}${cell(t('s_lessons'),lessons+'/'+Object.keys(LESSONS).length)}${cell(t('s_xp'),'⭐ '+S.xp)}
      ${cell(t('s_streak'),'🔥 '+streakNow()+' '+t('days'))}${cell(t('s_vocab'),seen+'/'+VOCAB.length)}${cell(t('s_acc'),acc)}${cell(t('s_speech'),sp)}</div>
    <div class="card p-4"><div class="font-black mb-2">🌐 ${t('lang')}</div><div class="flex gap-3"><button class="btn flex-1 ${S.lang==='zh'?'btn-primary':'btn-ghost'}" onclick="App.setLang('zh')">繁體中文</button><button class="btn flex-1 ${S.lang==='en'?'btn-primary':'btn-ghost'}" onclick="App.setLang('en')">English</button></div></div>
    <div class="card p-4"><div class="font-black mb-2">🕒 ${t('recent_hist')}</div>
      ${S.history.length?S.history.slice(0,8).map(h=>`<div class="py-2 text-sm flex justify-between" style="border-top:1px solid #eee"><span class="han">${h.hpOut?'💔 ':'✅ '}${tx(h.title)}</span><span class="text-slate-500">${h.acc}% ・ +${h.xp}XP</span></div>`).join(''):`<div class="text-sm text-slate-400">${t('no_hist')}</div>`}</div>
    <button class="btn btn-red" onclick="App.clearData()">🗑️ ${t('clear_data')}</button></div>`;
};

/* =====================================================================
   9. App 控制器
   ===================================================================== */
const App = {
  view:'home', spIdx:0, vf:{lv:'all',u:'all',q:''},
  go(v){ SpeechPracticeModule.abort(); this.view=v; this.render(); window.scrollTo(0,0); },
  render(){
    SpeechPracticeModule.abort();
    $('#view').innerHTML=View[this.view]();
    if(this.view==='vocab') this.drawVocab();
    if(this.view==='speech') SpeechUI.mount($('#spMount'),SPEECH[this.spIdx],res=>{ if(res&&res.passed){ addXp(3); } this.refreshSpeechChips(); });
    this.renderNav();
  },
  refreshSpeechChips(){ /* 練習完成後更新章節 ✓ 標記，不重繪錄音區 */
    const chips=document.querySelectorAll('#view .overflow-x-auto .chip');
    chips.forEach((c,i)=>{ const st=SpeechPracticeModule.stats(SPEECH[i].id); c.textContent=(i+1)+(st.passes>0?' ✓':''); });
  },
  renderNav(){
    const tabs=[['home','🏠','nav_home'],['vocab','📖','nav_vocab'],['speech','🎤','nav_speech'],['review','🔁','nav_review'],['profile','🧑','nav_me']];
    $('#nav').innerHTML=tabs.map(([id,ic,k])=>`<button class="navbtn ${this.view===id?'on':''}" onclick="App.go('${id}')"><span>${ic}</span>${t(k)}${id==='review'&&reviewCount()?` <b style="color:var(--r)">•</b>`:''}</button>`).join('');
  },
  drawVocab(){
    const f=this.vf, q=f.q.trim(), pq=plain(q);
    const list=VOCAB.filter(v=>(f.lv==='all'||v.lv===f.lv)&&(f.u==='all'||String(v.u)===String(f.u))&&(!q||v.han.includes(q)||plain(v.py).includes(pq)||v.en.toLowerCase().includes(q.toLowerCase())||v.ex.includes(q)));
    $('#vList').innerHTML=list.length?list.map(v=>{ const s=getV(v.id), pct=s.fam*20;
      return `<div class="card p-4">
        <div class="flex items-start justify-between"><div><span class="han" style="font-size:34px;font-weight:900">${v.han}</span> <span class="badge b-done">${v.pos}</span><div class="text-sky-500 font-bold">${v.py}</div></div>
          <!-- 【標準語音錄音放置區】${v.audio} -->
          <button class="btn btn-blue btn-sm" onclick="App.playVocab('${v.id}')">🔊</button></div>
        <div class="font-bold mt-1">${v.en}</div>
        <div class="mt-2 p-2 rounded-xl" style="background:#f7f9f4"><div class="han">${v.ex}</div><div class="text-xs text-slate-500">${v.exPy}</div><div class="text-xs text-slate-400">${v.exEn}</div></div>
        <div class="flex items-center gap-3 mt-3"><div class="flex-1"><div class="text-xs text-slate-400">${t('fam')} <span class="text-amber-500">${stars(s.fam)}</span> ${pct}%</div><div class="bar" style="height:8px"><div class="barfill gold" style="width:${pct}%"></div></div></div>
          <button class="btn ${s.review?'btn-ghost':'btn-primary'} btn-sm" onclick="App.toggleReview('${v.id}')">${s.review?t('in_review'):'＋ '+t('add_review')}</button></div></div>`; }).join(''):`<div class="text-center text-slate-400 py-8">${t('no_result')}</div>`;
  },
  playVocab(id){ const v=vById(id); playStd(v.audio,v.han); },
  toggleReview(id){ const s=ensureV(id); s.review=!s.review; if(s.review) s.due=Math.min(s.due||Date.now(),Date.now()); save(); this.drawVocab(); this.renderNav(); },
  startLesson(lid){ Lesson.startLesson(lid); },
  toast(msg){ const d=document.createElement('div'); d.textContent=msg; d.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:70;font-size:14px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); },
  /* 複習中心動作 */
  reviewWrong(){
    const entries=wrongList().map(w=>{ const l=LESSONS[w.lid]; const item=l&&l.items[w.idx]; return item?{item,ref:[w.lid,w.idx],key:w.key}:null; }).filter(Boolean);
    if(!entries.length) return this.toast(t('nothing'));
    Lesson.open({id:'review',title:L('錯題複習','Mistake review'),real:false,entries});
  },
  reviewVocab(){
    const list=shuffle(dueVocab()).slice(0,10); if(!list.length) return this.toast(t('nothing'));
    const entries=list.map(v=>{ const others=shuffle(VOCAB.filter(x=>x.id!==v.id&&x.en!==v.en)).slice(0,3).map(x=>x.en); const opts=shuffle([v.en,...others]);
      return {key:'vq:'+v.id,item:{t:'mc',q:L(`「${v.han}」（${v.py}）是什麼意思？`,`What does 「${v.han}」 (${v.py}) mean?`),opts,ans:opts.indexOf(v.en),exp:L(`${v.han} = ${v.en}`,`${v.han} = ${v.en}`),v:v.id}}; });
    Lesson.open({id:'review',title:L('詞彙複習','Vocabulary review'),real:false,entries});
  },
  reviewGrammar(){
    const entries=grammarList().map(g=>({key:'g:'+g,item:GRAMMAR[g]})); if(!entries.length) return this.toast(t('nothing'));
    Lesson.open({id:'review',title:L('語法複習','Grammar review'),real:false,entries});
  },
  resolveWrong(k){ if(S.wrong[k]){ S.wrong[k].resolved=true; save(); this.render(); } },
  knowVocab(id){ const s=ensureV(id); s.review=false; s.seen=true; s.fam=5; s.due=Date.now()+FAM_DAYS[5]*864e5; save(); this.render(); },
  knowGrammar(g){ S.grammar[g]=false; save(); this.render(); },
  setLang(l){ S.lang=l; save(); document.documentElement.lang=l==='zh'?'zh-Hant':'en'; this.render(); },
  clearData(){
    Modal.confirm({title:t('confirm_title'),body:t('confirm_body'),ok:t('confirm_ok'),cancel:t('cancel'),onOk:()=>{
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      const lang=S.lang; S=defaults(); S.lang=lang; save(); this.view='home'; this.render(); this.toast('✓');
    }});
  }
};

$('#lsExit').onclick=()=>Lesson.exit();
$('#lsPrev').onclick=()=>Lesson.go(-1);
$('#lsMain').onclick=()=>Lesson.main();
document.documentElement.lang = S.lang==='zh'?'zh-Hant':'en';
App.render();
</script>
</body>
